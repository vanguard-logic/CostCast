<style>
:root{
  --link:#1846A3;
  --blue:#1846A3; --blue-d:#0F2F73; --blue-l:#E8EEFA;
  --red:#C8102E; --red-l:#FBE7EA;
  --gold:#C08A4E; --gold-l:#F7EEE3;
  --purple:#6B2A7A;
  --green:#127A3E; --green-l:#E4F4EA;
  --ink:#1B2333; --ink2:#4A5468; --line:#DCE2EE; --bg:#F4F6FB; --card:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:16px}
.hide{display:none!important}

/* Sign in */
#start,#signin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 90px}
.si-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;width:100%;max-width:420px;box-shadow:0 8px 30px rgba(24,70,163,.08)}
.si-logo{width:100%;max-width:340px;display:block;margin:0 auto 6px}
.si-ver{text-align:center;color:var(--ink2);font-size:14px;margin-bottom:16px}
.seg{display:flex;background:var(--blue-l);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:9px;font-weight:700;color:var(--link);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.vld-logo{width:100%;max-width:340px;display:block;margin:0 auto 14px;border-radius:14px}
.vld-sm{width:100%;max-width:200px;display:block;margin:0 auto 12px;border-radius:10px}
.lvl{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.lvl .btn{padding:14px;font-size:17px}
.si-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.si-head h3{flex:1;text-align:center;font-size:18px;color:var(--blue-d)}
.sw-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.sw{border:2px solid var(--line);border-radius:12px;padding:8px 6px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.sw.on{border-color:var(--link);box-shadow:0 0 0 2px var(--blue-l)}
.sw i{display:flex;width:100%;height:24px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.12)}
.sw i span{flex:1}

/* Fields */
label.f{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--card);color:var(--ink)}
.in:focus{outline:2px solid var(--link);border-color:var(--link)}
.pw{position:relative}
.pw .in{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:36px;height:36px;cursor:pointer;color:var(--ink2)}
.eye svg{width:22px;height:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* Buttons */
a.btn{text-decoration:none}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.b-blue{background:var(--blue);color:#fff}
.b-red{background:var(--red);color:#fff}
.b-gold{background:var(--gold);color:#fff}
.b-line{background:var(--card);color:var(--link);border:1.5px solid var(--link)}
.b-del{background:var(--card);color:var(--red);border:1.5px solid var(--red)}
.b-sm{padding:7px 10px;font-size:14px;border-radius:8px}
.full{width:100%}
.link{background:none;border:0;color:var(--link);font-weight:700;cursor:pointer;padding:8px;text-decoration:underline}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1 1 auto}

/* App shell */
#app{min-height:100vh;padding-bottom:128px}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:6px 16px 8px}
.pw-line{text-align:center;font-size:12px;color:var(--ink2);margin-bottom:8px}
.pw-line b{color:var(--ink)}
.top-in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top-logo{height:38px;width:auto;display:block}
.top-ver{font-size:12px;font-weight:700;color:var(--ink2);margin-top:2px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.who b{color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--blue-l);color:var(--link)}
main{max-width:900px;margin:0 auto;padding:14px 16px}
h2.pg{font-size:22px;color:var(--blue-d);margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:17px;color:var(--blue-d);margin-bottom:8px}
.muted{color:var(--ink2);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--blue-l);border-radius:10px;padding:9px 8px;text-align:center}
.kpi span{display:block;font-size:12px;color:var(--ink2)}
.kpi b{font-size:16px;color:var(--blue-d)}
.big{font-size:30px;font-weight:800;color:var(--blue-d)}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.split:last-child{border-bottom:0}
.split b{white-space:nowrap}
.tot{font-size:17px;color:var(--red);font-weight:800;border-top:2px solid var(--ink);margin-top:4px;padding-top:9px;border-bottom:0}
.tier{border-radius:12px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tier small{display:block;color:var(--ink2);font-size:13px}
.tier b{font-size:18px;white-space:nowrap}
.t1{background:var(--blue-l);border-color:#BFD0F0}
.t4{background:var(--green-l);border-color:#A9DBBD}
.t4 b{color:var(--green);font-size:22px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--blue);color:#fff;text-align:left;padding:8px 7px;font-weight:700;white-space:nowrap}
td{padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tr.sub td{background:var(--gold-l);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px}
.p-raw{background:var(--blue-l);color:var(--link)}
.p-add{background:#F1E6F4;color:var(--purple)}
.p-pack{background:var(--gold-l);color:#8A5A22}
.p-util{background:#E6F2F4;color:#1C6B78}
.hidden-q{color:var(--purple);font-weight:700}
input[type=range]{width:100%;accent-color:var(--link)}
.list-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.li-name{font-weight:700}
.warn{color:var(--red);font-weight:700}
.ok{color:var(--green);font-weight:700}
.search{margin-bottom:10px}
.note{background:var(--gold-l);border-left:4px solid var(--gold);padding:9px 11px;border-radius:8px;font-size:14px;margin:8px 0}

/* Bottom nav + footer */
.navbar{position:fixed;left:0;right:0;bottom:30px;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
.navbar-in{display:flex;width:100%;max-width:900px}
.navbar button{flex:1;border:0;background:var(--card);padding:8px 2px 7px;font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.navbar button svg{width:22px;height:22px}
.navbar button.on{color:var(--link)}
.navbar button.on svg{stroke:var(--link)}
.foot{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:31;background:var(--blue-d);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 8px;text-align:center}

/* Modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,25,50,.45);display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 16px 18px}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:18px}}
.md-h{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px;z-index:2}
.md-h h3{flex:1;font-size:18px;color:var(--blue-d)}
.xb{border:0;background:var(--blue-l);color:var(--link);width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:700;cursor:pointer;flex:none}
.md-f{display:flex;gap:8px;margin-top:14px}
.md-f .btn{flex:1}
.bom-line{display:grid;grid-template-columns:1fr 92px 40px;gap:6px;align-items:center;margin-bottom:6px}
.bom-line.m{grid-template-columns:1fr 80px 70px 40px}
.bom-line .in{padding:9px 8px;font-size:15px}
.rm{border:0;background:var(--red-l);color:var(--red);height:38px;border-radius:8px;font-weight:800;cursor:pointer;font-size:18px}
#block{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px 16px 50px}
#block .si-card{text-align:center}
#block h3{font-size:20px;color:var(--red);margin:8px 0}
.demo-bar{background:var(--gold-l);border:1px solid var(--gold);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;z-index:60;background:#1B2333;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:10px 14px 10px 16px;border-radius:12px;font-size:15px;display:flex;align-items:center;gap:10px;max-width:92%}
.toast button{border:0;background:transparent;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.spin{width:30px;height:30px;border:4px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}

html.dk .p-add,html.dk .hidden-q{color:#E2B4EE}
html.dk .p-add{background:#3A2442}
html.dk .p-pack{color:#EBC596;background:#3A2F22}
html.dk .p-util{color:#93D6DF;background:#173A40}
html.dk .kpi b,html.dk h2.pg,html.dk .card h3{color:#E9EDF5}
html.dk .big{color:#FFFFFF}
@media print{
  header.top,.navbar,.foot,.powered,.btnrow,.noprint,input[type=range]{display:none!important}
  #app{padding:0}
  .card{break-inside:avoid;border-color:#999}
  body{background:#fff}
}
</style>
</head>
